# Quick start:                 docker compose up --build            -> http://localhost:8000
# Fully local AI (Ollama):     LLM_PROVIDER=ollama docker compose --profile local-ai up --build
# More background workers:     docker compose --profile scale up --build --scale worker=3
# PostgreSQL instead of SQLite: DATABASE_URL=postgresql://offerready:offerready@postgres:5432/offerready docker compose --profile postgres up
services:
  app:
    build: .
    image: offerready:latest
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_MODEL_SMART: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      DATABASE_URL: ${DATABASE_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      EMBEDDED_WORKER: ${EMBEDDED_WORKER:-true}
    volumes: ["offerready-data:/data"]
    restart: unless-stopped

  worker:                       # extra background workers for big batches (resume/project reviews)
    image: offerready:latest
    profiles: ["scale"]
    command: ["python", "-m", "app.worker"]
    environment:
      DATA_DIR: /data
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes: ["offerready-data:/data"]
    depends_on: [app]
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    profiles: ["local-ai"]
    volumes: ["ollama-models:/root/.ollama"]
    ports: ["11434:11434"]
    restart: unless-stopped
    # GPU: uncomment on a machine with the NVIDIA container toolkit
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  ollama-pull:                  # downloads the model once, then exits
    image: ollama/ollama
    profiles: ["local-ai"]
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen2.5:7b-instruct}"]

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment: { POSTGRES_USER: offerready, POSTGRES_PASSWORD: offerready, POSTGRES_DB: offerready }
    volumes: ["pg-data:/var/lib/postgresql/data"]

volumes:
  offerready-data:
  ollama-models:
  pg-data:
